<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#F5F3EA; font-family:'Plus Jakarta Sans', Inter, sans-serif;">
  <defs>
    <pattern id="fp-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E6E2D1" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#F5F3EA"/>
  <rect width="800" height="600" fill="url(#fp-grid)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#344D43" stroke-width="2"/>
  <rect x="36" y="36" width="728" height="528" fill="none" stroke="#D6A47C" stroke-width="0.8"/>

  <!-- Header Header Information -->
  <text x="60" y="75" fill="#344D43" font-size="20" font-weight="800" letter-spacing="1">VERDANT RESIDENCES</text>
  <text x="60" y="98" fill="#D6A47C" font-size="14" font-weight="700">2.5 BHK ROYALE SUITE</text>
  
  <line x1="60" y1="112" x2="740" y2="112" stroke="#E2DEC9" stroke-width="1.5"/>

  <!-- Dimension Metric Pill -->
  <g transform="translate(480, 58)">
    <rect x="0" y="0" width="240" height="42" rx="6" fill="#344D43"/>
    <text x="20" y="26" fill="#F5F3EA" font-size="11" font-weight="600">CARPET AREA:</text>
    <text x="120" y="26" fill="#D6A47C" font-size="13" font-weight="800">1,180 Sq. Ft. (109.6 Sq. M.)</text>
  </g>

  <!-- Compass Indicator -->
  <g transform="translate(710, 160)">
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="#344D43" stroke-width="1.2"/>
    <polygon points="0,-16 4,-3 0,0 -4,-3" fill="#344D43"/>
    <polygon points="0,16 4,3 0,0 -4,3" fill="#A8B9A0"/>
    <text x="0" y="-19" text-anchor="middle" fill="#344D43" font-size="9" font-weight="800">N</text>
  </g>

  <!-- Architectural Layout Render -->
  <g transform="translate(20, 20)">
    
        <g>
          <rect x="70" y="130" width="80" height="60" fill="#FAF8F2" stroke="#344D43" stroke-width="1.5"/>
          <text x="110.0" y="155.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">ENTRY FOYER</text>
          <text x="110.0" y="170.0" text-anchor="middle" fill="#717568" font-size="9">6'0" x 5'6"</text>
        </g>
        
        <g>
          <rect x="150" y="130" width="260" height="190" fill="#FFFFFF" stroke="#344D43" stroke-width="1.5"/>
          <text x="280.0" y="220.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">LIVING &amp; DINING</text>
          <text x="280.0" y="235.0" text-anchor="middle" fill="#717568" font-size="9">21'0" x 14'6"</text>
        </g>
        
        <g>
          <rect x="410" y="130" width="110" height="190" fill="#E8ECE5" stroke="#344D43" stroke-width="1.5"/>
          <text x="465.0" y="220.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">SUN TERRACE DECK</text>
          <text x="465.0" y="235.0" text-anchor="middle" fill="#717568" font-size="9">18'0" x 7'0"</text>
        </g>
        
        <g>
          <rect x="70" y="190" width="80" height="130" fill="#FAF8F2" stroke="#344D43" stroke-width="1.5"/>
          <text x="110.0" y="250.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">KITCHEN &amp; UTILITY</text>
          <text x="110.0" y="265.0" text-anchor="middle" fill="#717568" font-size="9">11'0" x 8'0"</text>
        </g>
        
        <g>
          <rect x="70" y="320" width="180" height="120" fill="#FFFFFF" stroke="#344D43" stroke-width="1.5"/>
          <text x="160.0" y="375.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">BEDROOM 02</text>
          <text x="160.0" y="390.0" text-anchor="middle" fill="#717568" font-size="9">13'0" x 11'0"</text>
        </g>
        
        <g>
          <rect x="250" y="320" width="140" height="120" fill="#FAF8F2" stroke="#344D43" stroke-width="1.5"/>
          <text x="320.0" y="375.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">STUDY / ZEN POD</text>
          <text x="320.0" y="390.0" text-anchor="middle" fill="#717568" font-size="9">9'6" x 8'6"</text>
        </g>
        
        <g>
          <rect x="390" y="320" width="210" height="130" fill="#FFFFFF" stroke="#344D43" stroke-width="1.5"/>
          <text x="495.0" y="380.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">MASTER BEDROOM</text>
          <text x="495.0" y="395.0" text-anchor="middle" fill="#717568" font-size="9">15'6" x 12'6"</text>
        </g>
        
        <g>
          <rect x="600" y="320" width="100" height="70" fill="#FAF8F2" stroke="#344D43" stroke-width="1.5"/>
          <text x="650.0" y="350.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">MASTER BATH</text>
          <text x="650.0" y="365.0" text-anchor="middle" fill="#717568" font-size="9">8'0" x 5'6"</text>
        </g>
        
        <g>
          <rect x="600" y="390" width="100" height="60" fill="#FAF8F2" stroke="#344D43" stroke-width="1.5"/>
          <text x="650.0" y="415.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">COMMON BATH</text>
          <text x="650.0" y="430.0" text-anchor="middle" fill="#717568" font-size="9">7'0" x 5'0"</text>
        </g>
        
  </g>

  <!-- Architectural Features / Key Specifications Footer -->
  <g transform="translate(60, 500)">
    <rect x="0" y="0" width="680" height="45" rx="4" fill="#FFFFFF" stroke="#E2DEC9"/>
    <text x="25" y="27" fill="#344D43" font-size="10" font-weight="700">SPECIFICATIONS:</text>
    <text x="140" y="27" fill="#55584F" font-size="10">Balcony: 145 Sq. Ft. Deck • Ceiling Height: 10'6" • Italian Marble Flooring • Acoustic Double-Glazed Glass</text>
  </g>
</svg>