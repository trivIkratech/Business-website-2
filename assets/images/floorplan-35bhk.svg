<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#F5F3EA; font-family:'Plus Jakarta Sans', Inter, sans-serif;">
  <defs>
    <pattern id="fp-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E6E2D1" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#F5F3EA"/>
  <rect width="800" height="600" fill="url(#fp-grid)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#344D43" stroke-width="2"/>
  <rect x="36" y="36" width="728" height="528" fill="none" stroke="#D6A47C" stroke-width="0.8"/>

  <!-- Header Header Information -->
  <text x="60" y="75" fill="#344D43" font-size="20" font-weight="800" letter-spacing="1">AURELIA RESIDENCES</text>
  <text x="60" y="98" fill="#D6A47C" font-size="14" font-weight="700">3.5 BHK SKY SANCTUARY</text>
  
  <line x1="60" y1="112" x2="740" y2="112" stroke="#E2DEC9" stroke-width="1.5"/>

  <!-- Dimension Metric Pill -->
  <g transform="translate(480, 58)">
    <rect x="0" y="0" width="240" height="42" rx="6" fill="#344D43"/>
    <text x="20" y="26" fill="#F5F3EA" font-size="11" font-weight="600">CARPET AREA:</text>
    <text x="120" y="26" fill="#D6A47C" font-size="13" font-weight="800">1,890 Sq. Ft. (175.5 Sq. M.)</text>
  </g>

  <!-- Compass Indicator -->
  <g transform="translate(710, 160)">
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="#344D43" stroke-width="1.2"/>
    <polygon points="0,-16 4,-3 0,0 -4,-3" fill="#344D43"/>
    <polygon points="0,16 4,3 0,0 -4,3" fill="#A8B9A0"/>
    <text x="0" y="-19" text-anchor="middle" fill="#344D43" font-size="9" font-weight="800">N</text>
  </g>

  <!-- Architectural Layout Render -->
  <g transform="translate(20, 20)">
    
        <g>
          <rect x="70" y="120" width="100" height="70" fill="#FAF8F2" stroke="#344D43" stroke-width="1.5"/>
          <text x="120.0" y="150.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">ELEVATOR FOYER</text>
          <text x="120.0" y="165.0" text-anchor="middle" fill="#717568" font-size="9">8'0" x 7'0"</text>
        </g>
        
        <g>
          <rect x="170" y="120" width="320" height="200" fill="#FFFFFF" stroke="#344D43" stroke-width="1.5"/>
          <text x="330.0" y="215.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">SALON LIVING &amp; FORMAL DINING</text>
          <text x="330.0" y="230.0" text-anchor="middle" fill="#717568" font-size="9">26'0" x 17'6"</text>
        </g>
        
        <g>
          <rect x="490" y="120" width="140" height="200" fill="#E8ECE5" stroke="#344D43" stroke-width="1.5"/>
          <text x="560.0" y="215.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">WRAPAROUND SKY TERRACE</text>
          <text x="560.0" y="230.0" text-anchor="middle" fill="#717568" font-size="9">24'0" x 9'6"</text>
        </g>
        
        <g>
          <rect x="70" y="190" width="100" height="130" fill="#FAF8F2" stroke="#344D43" stroke-width="1.5"/>
          <text x="120.0" y="250.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">MODULAR CHEF KITCHEN</text>
          <text x="120.0" y="265.0" text-anchor="middle" fill="#717568" font-size="9">14'0" x 10'0"</text>
        </g>
        
        <g>
          <rect x="70" y="320" width="160" height="130" fill="#FFFFFF" stroke="#344D43" stroke-width="1.5"/>
          <text x="150.0" y="380.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">SUITE BEDROOM 03</text>
          <text x="150.0" y="395.0" text-anchor="middle" fill="#717568" font-size="9">14'6" x 12'0"</text>
        </g>
        
        <g>
          <rect x="230" y="320" width="140" height="130" fill="#FAF8F2" stroke="#344D43" stroke-width="1.5"/>
          <text x="300.0" y="380.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">EXECUTIVE STUDY / PUJA</text>
          <text x="300.0" y="395.0" text-anchor="middle" fill="#717568" font-size="9">10'6" x 9'6"</text>
        </g>
        
        <g>
          <rect x="370" y="320" width="170" height="140" fill="#FFFFFF" stroke="#344D43" stroke-width="1.5"/>
          <text x="455.0" y="385.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">SUITE BEDROOM 02</text>
          <text x="455.0" y="400.0" text-anchor="middle" fill="#717568" font-size="9">15'0" x 13'0"</text>
        </g>
        
        <g>
          <rect x="540" y="320" width="175" height="140" fill="#FFFFFF" stroke="#344D43" stroke-width="1.5"/>
          <text x="627.5" y="385.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">PRESIDENTIAL MASTER SUITE</text>
          <text x="627.5" y="400.0" text-anchor="middle" fill="#717568" font-size="9">18'6" x 14'6"</text>
        </g>
        
  </g>

  <!-- Architectural Features / Key Specifications Footer -->
  <g transform="translate(60, 500)">
    <rect x="0" y="0" width="680" height="45" rx="4" fill="#FFFFFF" stroke="#E2DEC9"/>
    <text x="25" y="27" fill="#344D43" font-size="10" font-weight="700">SPECIFICATIONS:</text>
    <text x="140" y="27" fill="#55584F" font-size="10">Balcony: 230 Sq. Ft. Wraparound Terrace • Ceiling Height: 10'6" • Italian Marble Flooring • Acoustic Double-Glazed Glass</text>
  </g>
</svg>