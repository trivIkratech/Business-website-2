  <!-- Architectural Features / Key Specifications Footer -->
  <g transform="translate(60, 500)">
    <rect x="0" y="0" width="680" height="45" rx="4" fill="#FFFFFF" stroke="#E2DEC9"/>
    <text x="25" y="27" fill="#344D43" font-size="10" font-weight="700">SPECIFICATIONS:</text>
    <text x="140" y="27" fill="#55584F" font-size="10">Balcony: 180 Sq. Ft. Private Deck • Ceiling Height: 10'6" • Italian Marble Flooring • Acoustic Double-Glazed Glass</text>
