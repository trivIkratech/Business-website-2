          <text x="310.0" y="395.0" text-anchor="middle" fill="#717568" font-size="9">14'0" x 12'0"</text>
        </g>
        
        <g>
          <rect x="390" y="320" width="220" height="140" fill="#FFFFFF" stroke="#344D43" stroke-width="1.5"/>
          <text x="500.0" y="385.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">MASTER SUITE</text>
          <text x="500.0" y="400.0" text-anchor="middle" fill="#717568" font-size="9">17'0" x 13'6"</text>
        </g>
        
        <g>
          <rect x="610" y="320" width="95" height="75" fill="#FAF8F2" stroke="#344D43" stroke-width="1.5"/>
          <text x="657.5" y="352.5" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">MASTER ENSUITE</text>
          <text x="657.5" y="367.5" text-anchor="middle" fill="#717568" font-size="9">9'0" x 6'0"</text>
        </g>
        
        <g>
          <rect x="610" y="395" width="95" height="65" fill="#FAF8F2" stroke="#344D43" stroke-width="1.5"/>
          <text x="657.5" y="422.5" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">BATHROOM 02</text>
          <text x="657.5" y="437.5" text-anchor="middle" fill="#717568" font-size="9">8'0" x 5'6"</text>
        </g>
        
