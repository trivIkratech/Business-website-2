          <text x="115.0" y="152.5" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">PRIVATE FOYER</text>
          <text x="115.0" y="167.5" text-anchor="middle" fill="#717568" font-size="9">7'0" x 6'0"</text>
        </g>
        
        <g>
