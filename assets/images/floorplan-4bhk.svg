<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#F5F3EA; font-family:'Plus Jakarta Sans', Inter, sans-serif;">
  <defs>
    <pattern id="fp-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E6E2D1" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#F5F3EA"/>
  <rect width="800" height="600" fill="url(#fp-grid)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#344D43" stroke-width="2"/>
  <rect x="36" y="36" width="728" height="528" fill="none" stroke="#D6A47C" stroke-width="0.8"/>

  <!-- Header Header Information -->
  <text x="60" y="75" fill="#344D43" font-size="20" font-weight="800" letter-spacing="1">VERDANT RESIDENCES</text>
  <text x="60" y="98" fill="#D6A47C" font-size="14" font-weight="700">4.5 BHK PENTHOUSE PAVILION</text>
  
  <line x1="60" y1="112" x2="740" y2="112" stroke="#E2DEC9" stroke-width="1.5"/>

  <!-- Dimension Metric Pill -->
  <g transform="translate(480, 58)">
    <rect x="0" y="0" width="240" height="42" rx="6" fill="#344D43"/>
    <text x="20" y="26" fill="#F5F3EA" font-size="11" font-weight="600">CARPET AREA:</text>
    <text x="120" y="26" fill="#D6A47C" font-size="13" font-weight="800">2,450 Sq. Ft. (227.6 Sq. M.)</text>
  </g>

  <!-- Compass Indicator -->
  <g transform="translate(710, 160)">
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="#344D43" stroke-width="1.2"/>
    <polygon points="0,-16 4,-3 0,0 -4,-3" fill="#344D43"/>
    <polygon points="0,16 4,3 0,0 -4,3" fill="#A8B9A0"/>
    <text x="0" y="-19" text-anchor="middle" fill="#344D43" font-size="9" font-weight="800">N</text>
  </g>

  <!-- Architectural Layout Render -->
  <g transform="translate(20, 20)">
    
        <g>
          <rect x="70" y="120" width="110" height="75" fill="#FAF8F2" stroke="#344D43" stroke-width="1.5"/>
          <text x="125.0" y="152.5" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">PRIVATE LIFT GALLERY</text>
          <text x="125.0" y="167.5" text-anchor="middle" fill="#717568" font-size="9">9'6" x 7'6"</text>
        </g>
        
        <g>
          <rect x="180" y="120" width="330" height="205" fill="#FFFFFF" stroke="#344D43" stroke-width="1.5"/>
          <text x="345.0" y="217.5" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">GRAND SALON &amp; BANQUET DINING</text>
          <text x="345.0" y="232.5" text-anchor="middle" fill="#717568" font-size="9">28'0" x 19'0"</text>
        </g>
        
        <g>
          <rect x="510" y="120" width="170" height="205" fill="#E8ECE5" stroke="#344D43" stroke-width="1.5"/>
          <text x="595.0" y="217.5" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">SKY GARDEN &amp; JACUZZI DECK</text>
          <text x="595.0" y="232.5" text-anchor="middle" fill="#717568" font-size="9">26'0" x 12'0"</text>
        </g>
        
        <g>
          <rect x="70" y="195" width="110" height="130" fill="#FAF8F2" stroke="#344D43" stroke-width="1.5"/>
          <text x="125.0" y="255.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">CHEF KITCHEN &amp; MAID SUITE</text>
          <text x="125.0" y="270.0" text-anchor="middle" fill="#717568" font-size="9">15'0" x 11'0"</text>
        </g>
        
        <g>
          <rect x="70" y="325" width="170" height="130" fill="#FFFFFF" stroke="#344D43" stroke-width="1.5"/>
          <text x="155.0" y="385.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">GUEST PRESIDENTIAL SUITE</text>
          <text x="155.0" y="400.0" text-anchor="middle" fill="#717568" font-size="9">16'0" x 13'0"</text>
        </g>
        
        <g>
          <rect x="240" y="325" width="140" height="130" fill="#FAF8F2" stroke="#344D43" stroke-width="1.5"/>
          <text x="310.0" y="385.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">PRIVATE LIBRARY &amp; CIGAR LOUNGE</text>
          <text x="310.0" y="400.0" text-anchor="middle" fill="#717568" font-size="9">11'6" x 10'0"</text>
        </g>
        
        <g>
          <rect x="380" y="325" width="160" height="140" fill="#FFFFFF" stroke="#344D43" stroke-width="1.5"/>
          <text x="460.0" y="390.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">ROYAL SUITE 03</text>
          <text x="460.0" y="405.0" text-anchor="middle" fill="#717568" font-size="9">16'0" x 13'6"</text>
        </g>
        
        <g>
          <rect x="540" y="325" width="170" height="140" fill="#FFFFFF" stroke="#344D43" stroke-width="1.5"/>
          <text x="625.0" y="390.0" text-anchor="middle" fill="#30332F" font-size="11" font-weight="700">OWNER'S MASTER RETREAT</text>
          <text x="625.0" y="405.0" text-anchor="middle" fill="#717568" font-size="9">20'0" x 16'0"</text>
        </g>
        
  </g>

  <!-- Architectural Features / Key Specifications Footer -->
  <g transform="translate(60, 500)">
    <rect x="0" y="0" width="680" height="45" rx="4" fill="#FFFFFF" stroke="#E2DEC9"/>
    <text x="25" y="27" fill="#344D43" font-size="10" font-weight="700">SPECIFICATIONS:</text>
    <text x="140" y="27" fill="#55584F" font-size="10">Balcony: 320 Sq. Ft. Double-Height Verandah • Ceiling Height: 10'6" • Italian Marble Flooring • Acoustic Double-Glazed Glass</text>
  </g>
</svg>